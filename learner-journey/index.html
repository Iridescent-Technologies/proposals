<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zavmo — The Learner Journey</title>
<style>
  :root{--teal:#22c7a9;--teal-soft:#9fe8da;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#0a1b2e 0%,#102a49 55%,#0a1b2e 100%);color:#fff;overflow:hidden;height:100vh}
  .stage{position:fixed;inset:0;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:12px;padding:18px 26px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
  .zmark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,#16324f,#0a1b2e);display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .zmark span{font-weight:700;font-size:15px}
  .bar .spacer{flex:1}
  .counter{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);letter-spacing:.04em;margin-right:4px}
  .btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#dfe9f4;font-size:12px;letter-spacing:.04em;padding:7px 12px;border-radius:8px;cursor:pointer;transition:.15s}
  .btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28)}
  .btn.accent{border-color:rgba(34,199,169,.5);color:#bff0e5}
  .slide{flex:1;display:flex;align-items:center;justify-content:center;gap:46px;padding:6px 56px 26px;min-height:0}
  .copy{width:340px;flex:none}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:14px}
  .title{font-size:32px;line-height:1.13;font-weight:600;letter-spacing:-.01em;margin-bottom:16px}
  .caption{font-size:15.5px;line-height:1.62;color:#cdd9e7;font-weight:300}
  .step-no{margin-top:22px;font-size:13px;color:var(--muted)}
  .shotwrap{flex:1;height:100%;display:flex;align-items:center;justify-content:center;min-width:0}
  .shot{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 30px 70px -22px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);background:#fff}
  .shot img{display:block;max-width:100%;max-height:80vh;border-radius:14px}
  .shot.dark{background:#0a1422}
  .cover,.sectiondiv{flex-direction:column;gap:0;text-align:center}
  .cover .zbig{width:74px;height:74px;border-radius:20px;margin-bottom:30px}
  .cover .zbig span{font-size:36px}
  .cover .big{font-size:60px;line-height:1.05;font-weight:600;letter-spacing:-.02em}
  .cover .big em{font-style:normal;color:var(--teal)}
  .cover .sub{margin-top:22px;font-size:19px;color:#cdd9e7;font-weight:300;max-width:52ch;line-height:1.6}
  .cover .meta{margin-top:36px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .hint{margin-top:30px;font-size:13px;color:var(--muted)}
  .hint kbd{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:0 2px;font-size:12px}
  .sectiondiv .snum{font-size:15px;letter-spacing:.3em;color:var(--teal);font-weight:600;margin-bottom:18px}
  .sectiondiv .stitle{font-size:50px;font-weight:600;letter-spacing:-.02em;max-width:18ch}
  .sectiondiv .ssub{margin-top:18px;font-size:18px;color:#cdd9e7;font-weight:300;max-width:48ch;line-height:1.6}
  .sectiondiv .srule{width:54px;height:3px;background:linear-gradient(90deg,var(--teal),var(--teal-soft));border-radius:2px;margin:28px auto 0}
  .progress{height:3px;background:rgba(255,255,255,.08)}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-soft));transition:width .35s cubic-bezier(.4,0,.2,1)}
  .dots{display:flex;gap:5px;justify-content:center;padding:12px 0 16px;flex-wrap:wrap}
  .dots b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:.2s}
  .dots b.on{background:var(--teal);transform:scale(1.35)}
  .dots b.sec{width:5px;height:5px;background:rgba(34,199,169,.45);border-radius:1px;transform:rotate(45deg)}
  .dots b.sec.on{background:var(--teal)}
  .zone{position:fixed;top:64px;bottom:56px;width:20%;z-index:5;cursor:pointer}
  .zone.l{left:0}.zone.r{right:0}
  .nav-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:6;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;opacity:0;transition:.2s}
  .stage:hover .nav-arrow{opacity:.6}
  .nav-arrow:hover{opacity:1!important;background:rgba(255,255,255,.16)}
  .nav-arrow.l{left:18px}.nav-arrow.r{right:18px}
  .nav-arrow svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* jump-to-section menu */
  .menu{position:fixed;inset:0;background:rgba(8,17,29,.92);z-index:40;display:none;align-items:center;justify-content:center}
  .menu.show{display:flex}
  .menu-inner{width:min(680px,90vw);max-height:84vh;overflow:auto}
  .menu-title{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);font-weight:600;text-align:center;margin-bottom:24px}
  .menu-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .menu-item{display:flex;align-items:baseline;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);cursor:pointer;transition:.15s}
  .menu-item:hover{border-color:var(--teal);background:rgba(34,199,169,.08);transform:translateY(-2px)}
  .menu-item .mnum{font-size:12px;letter-spacing:.16em;color:var(--teal);font-weight:600;white-space:nowrap}
  .menu-item .mtit{font-size:18px;font-weight:600}
  .menu-item .msub{font-size:13px;color:var(--muted);font-weight:300;margin-top:2px}
  .menu-close{position:fixed;top:22px;right:28px;color:var(--muted);font-size:13px;letter-spacing:.1em;cursor:pointer}
  .grid{position:fixed;inset:0;background:rgba(8,17,29,.97);z-index:30;display:none;grid-template-columns:repeat(4,1fr);gap:15px;padding:54px;overflow:auto;align-content:start}
  .grid.show{display:grid}
  .grid .ghead{grid-column:1/-1;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-top:8px}
  .grid figure{cursor:pointer;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0f2540;transition:.18s}
  .grid figure:hover{border-color:var(--teal);transform:translateY(-3px)}
  .grid img{width:100%;display:block}
  .grid figcaption{font-size:12px;color:#cdd9e7;padding:8px 10px}
  .grid .gclose{position:fixed;top:20px;right:26px;color:var(--muted);font-size:13px;letter-spacing:.1em;cursor:pointer}
  @media (max-width:1024px){.slide{flex-direction:column;gap:18px;padding:10px 22px 18px}.copy{width:100%;max-width:680px;text-align:center}.shot img{max-height:50vh}.menu-list{grid-template-columns:1fr}}
  .fade{animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="bar">
    <div class="brand"><span class="zmark"><span>Z</span></span> Zavmo</div>
    <div class="spacer"></div>
    <div class="counter" id="counter"></div>
    <button class="btn accent" id="menuBtn" title="Jump to a section (M)">Sections</button>
    <button class="btn" id="gridBtn" title="Overview (G)">Overview</button>
    <button class="btn" id="fsBtn" title="Fullscreen (F)">Fullscreen</button>
  </div>
  <div class="slide" id="slide"></div>
  <div class="dots" id="dots"></div>
  <div class="progress"><i id="bar"></i></div>
</div>
<div class="zone l" id="zl"></div><div class="zone r" id="zr"></div>
<div class="nav-arrow l" id="al"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div>
<div class="nav-arrow r" id="ar"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
<div class="menu" id="menu"><div class="menu-close" id="menuClose">CLOSE ✕</div><div class="menu-inner"><div class="menu-title">Jump to a learner experience</div><div class="menu-list" id="menuList"></div></div></div>
<div class="grid" id="grid"><div class="gclose" id="gclose">CLOSE ✕</div></div>

<script>
const S=[
  { cover:true, big:'The Zavmo<br><em>learner journey</em>',
    sub:'From first sign-up to a personalised qualification — a walk-through of the live product at learn.zavmo.ai.' },

  { section:true, num:'PART 1', title:'Getting started', sub:'Sign-up to first conversation.' },
  { img:'01.png', eyebrow:'Getting started', title:'Sign up', caption:'A learner arrives. No jargon — just a name, an email, and a conversation about to begin.' },
  { img:'02.png', eyebrow:'Getting started', title:'Create an account', caption:'Sign-up takes seconds and flows straight into onboarding — no email-verification friction in the way of the first experience.' },

  { section:true, num:'PART 2', title:'Onboarding', sub:'Seven short chapters that build a portrait of the learner — who they are, where they’re heading, and how they learn best.' },
  { img:'03.png', eyebrow:'Onboarding · Chapter 1', title:'Who you are', caption:'Zavmo introduces itself and learns the basics — one gentle question at a time, with a progress rail on the right.' },
  { img:'04.png', eyebrow:'Onboarding · Chapter 2', title:'What you’re doing now', caption:'Role, industry and experience — and an honest picture of the working week. The role is matched to a shared library to keep language consistent.' },
  { img:'05.png', eyebrow:'Onboarding · Chapter 3', title:'What you’ve studied', caption:'Prior qualifications, matched to the OFQUAL register — so Zavmo never wastes time teaching what you already know.' },
  { img:'06.png', eyebrow:'Onboarding · Chapter 4', title:'Where you’re heading', caption:'Goals at six months, two years and five years. This is the heart of it — Zavmo designs the path backwards from where you want to be.' },
  { img:'07.png', eyebrow:'Onboarding', title:'A halfway pulse-check', caption:'The required chapters are done. The next three are optional and more personal — the learner stays in control of how far to go.' },
  { img:'08.png', eyebrow:'Onboarding · Chapter 5', title:'How you feel about it', caption:'When you’re most yourself, and where the wobble shows up. Zavmo gets to know the person, not the CV.' },
  { img:'09.png', eyebrow:'Onboarding · Chapter 6', title:'Things you love', caption:'Books, films and music — so examples and stories are yours, never generic corporate speak.' },
  { img:'10.png', eyebrow:'Onboarding · Chapter 7 · Pedagogy', title:'It learns how <em style="color:var(--teal);font-style:normal">you</em> learn', caption:'This is the metacognition that sets Zavmo apart: before teaching anything, it asks how you actually learn — your sharpest time of day, the session length you’ll sustain, the pace you want, whether you need the example or the theory first. Every lesson is then delivered the way you take things in best.' },
  { img:'11.png', eyebrow:'The payoff', title:'Your portrait', caption:'Zavmo reflects back everything it heard — “here’s who I see” — turning a profile into a recognisable person before suggesting a single thing.' },

  { section:true, num:'PART 3', title:'Your dashboard', sub:'Everything personal, in one place.' },
  { img:'12.png', eyebrow:'In the app', title:'Home', caption:'A personalised dashboard: where you are, where you’re heading, and a clear next step — with Zavmo narrating what it has noticed.' },

  { section:true, num:'PART 4', title:'Discover & assess', sub:'Choose a real qualification, then prove where you actually stand.' },
  { img:'13.png', eyebrow:'Discover', title:'Pick your path', caption:'Current role, a future goal, and an OFQUAL-regulated qualification — three ways in, each shaping what comes next.' },
  { img:'27.png', eyebrow:'Discover · Job description', title:'See the role before you choose it', caption:'Every role is backed by a real job description — day-to-day, responsibilities by experience band, and stakeholders — so learners pick their next role with eyes open, not blind.' },
  { img:'14.png', eyebrow:'Discover · Qualification', title:'Real, regulated qualifications', caption:'Search the live OFQUAL register — every result is a genuine, regulated qualification with its real credits, units and awarding body.' },
  { img:'15.png', eyebrow:'Discover · Your path', title:'A path, assembled', caption:'Current role plus a Level 5 leadership qualification — the destination is set, and Zavmo can work backwards from it.' },
  { img:'16.png', eyebrow:'Discover · Confidence check', title:'An assessment that thinks', caption:'Zavmo writes a bespoke, role-specific Level 5 scenario on the spot — a real dilemma with no clean answer — to find where you genuinely stand.' },
  { img:'17.png', eyebrow:'Assessment', title:'Your skills assessment', caption:'The chosen qualification breaks into real OFQUAL units. Zavmo assesses each one — the Choose path → Assessment → Schedule → Learn → Certify journey.' },
  { img:'18.png', eyebrow:'Assessment · Pedagogy', title:'Built on Bloom’s taxonomy', caption:'The backbone of how Zavmo teaches. Every skill is mapped across the six cognitive levels — Remember, Understand, Apply, Analyse, Evaluate, Create — so progress is measured by depth of understanding, not boxes ticked. This is mastery learning: the one-to-one, two-sigma method, delivered at scale.' },
  { img:'19.png', eyebrow:'Assessment', title:'Show your thinking', caption:'Then a generated, role-specific scenario asks you to evidence the skill in your own words — graded by Zavmo, not a multiple-choice quiz.' },
  { img:'20.png', eyebrow:'Assessment', title:'Your study plan', caption:'From the results, Zavmo builds a priority-ordered study plan — units, hours, and a week-by-week timeline with milestones.' },

  { section:true, num:'PART 5', title:'Lesson delivery', sub:'An AI coach that teaches in your world — pitched at your Bloom’s level, paced to how you learn, and you can talk to it.' },
  { img:'21.png', eyebrow:'Deliver · The Coach', title:'Teaching, in context', caption:'“The Coach” teaches conversationally, using a worked example drawn from Alex’s own world — a burnt-out engineering team shipping API fixes — then asks a real question.' },
  { img:'33.png', eyebrow:'Deliver · Interactive & gamified', title:'You steer it — and it scores you', caption:'Every message is interactive: answer in your own words, or tap “Got it”, “Slower please”, “Show me an example” or “Read it to me”. And it’s gamified — Zavmo grades your thinking live at Bloom level 4 (Analysing) and tracks you against the learning outcomes as you go.' },
  { img:'22.png', eyebrow:'Deliver · Adaptive', title:'It adapts to your answer', caption:'When the learner answers, Zavmo recognises the competence shown and stress-tests it with a sharper, harder follow-up — pitched exactly at where they are, not a fixed script.' },
  { img:'28.png', eyebrow:'Deliver · Voice', title:'Talk to Zavmo, hands-free', caption:'Learners don’t have to type. Turn on voice and Zavmo reads every reply aloud and transcribes what you say (via ElevenLabs) — streamed in the moment, never stored, consent you can withdraw any time.' },
  { img:'23.png', eyebrow:'Deliver · Gamified progress', title:'Progress you can see', caption:'A live module-completion bar, the learning outcomes being met, and space for the learner’s own notes — momentum made visible.' },

  { section:true, num:'PART 6', title:'Demonstrate', sub:'Prove the skill — not just recognise it.' },
  { img:'24.png', eyebrow:'Demonstrate', title:'Show what you’ve learned', caption:'A twelve-question check with a live running score. The learner has to demonstrate the competence the lesson built.' },
  { img:'25.png', eyebrow:'Demonstrate', title:'Instant feedback, live score', caption:'Right answers build the running total toward the credential — immediate, gamified feedback at every step.' },

  { section:true, num:'PART 7', title:'The credential', sub:'Proof that travels — aligned to a real, regulated qualification.' },
  { img:'26.png', eyebrow:'Certify', title:'Your readiness statement', caption:'Score 100% and Zavmo issues an OFQUAL-aligned readiness statement — “ready to sit the NQual Level 5 unit”, worth 21 credits, downloadable and shareable to LinkedIn.' },

  { section:true, num:'PART 8', title:'Your profile', sub:'A living profile the learner owns.' },
  { img:'29.png', eyebrow:'Your profile', title:'Everything you’ve shared, in one place', caption:'Work, goals, how you like to learn, interests and support needs — all editable any time and auto-saving as you go. The more Zavmo knows, the better it shapes what comes next.' },

  { section:true, num:'PART 9', title:'Mind Palace', sub:'Progress you can see, feel and return to — a constellation that grows with you.' },
  { img:'30.png', darkframe:true, eyebrow:'Mind Palace · Day one', title:'It begins with one moment', caption:'Every learner starts with an empty sky. “Your palace begins with one moment of learning” — the first outcome you master lights the first star.' },
  { img:'31.png', darkframe:true, eyebrow:'Mind Palace · Taking shape', title:'The first stars appear', caption:'A few outcomes in, the constellation starts to form — each star a learning outcome mastered, each line a connection between ideas, clustered by module. The brighter the star, the stronger the evidence.' },
  { img:'32.png', darkframe:true, eyebrow:'Mind Palace · Growing', title:'A map of everything you know', caption:'As the learner progresses, the palace fills in — here, seventeen outcomes across five clusters, reaching Evaluate-level (Bloom 5), two earned just today. Progress becomes something you can see, feel and come back to.' },
];

let i=0;
const slide=document.getElementById('slide'),counter=document.getElementById('counter'),dots=document.getElementById('dots'),bar=document.getElementById('bar');
const contentCount=S.filter(s=>s.img).length;
function contentIndexOf(n){return S.slice(0,n+1).filter(s=>s.img).length;}
function render(){
  const s=S[i];
  slide.className='slide fade'+(s.cover?' cover':'')+(s.section?' sectiondiv':'');
  if(s.cover){slide.innerHTML=`<span class="zmark zbig"><span>Z</span></span><div class="big">${s.big}</div><div class="sub">${s.sub}</div><div class="meta">Live product walk-through</div><div class="hint">Use <kbd>←</kbd> <kbd>→</kbd> or click to move · <kbd>M</kbd> sections · <kbd>G</kbd> overview · <kbd>F</kbd> fullscreen</div>`;}
  else if(s.section){slide.innerHTML=`<div class="snum">${s.num}</div><div class="stitle">${s.title}</div><div class="ssub">${s.sub}</div><div class="srule"></div>`;}
  else{const ci=contentIndexOf(i);slide.innerHTML=`<div class="copy"><div class="eyebrow">${s.eyebrow}</div><div class="title">${s.title}</div><div class="caption">${s.caption}</div><div class="step-no">${ci} / ${contentCount}</div></div><div class="shotwrap"><div class="shot${s.darkframe?' dark':''}"><img src="images/${s.img}" alt="${s.title}"></div></div>`;}
  counter.textContent=(i+1)+' / '+S.length;
  bar.style.width=(i/(S.length-1)*100)+'%';
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
  void slide.offsetWidth;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
function next(){if(i<S.length-1)go(i+1);}function prev(){if(i>0)go(i-1);}
S.forEach((s,k)=>{const b=document.createElement('b');if(s.section)b.className='sec';b.onclick=()=>go(k);dots.appendChild(b);});
document.getElementById('zr').onclick=next;document.getElementById('zl').onclick=prev;
document.getElementById('ar').onclick=next;document.getElementById('al').onclick=prev;

// jump-to-section menu
const menu=document.getElementById('menu'),menuList=document.getElementById('menuList');
S.forEach((s,k)=>{if(!s.section)return;const it=document.createElement('div');it.className='menu-item';it.innerHTML=`<span class="mnum">${s.num}</span><div><div class="mtit">${s.title}</div><div class="msub">${s.sub}</div></div>`;it.onclick=()=>{go(k);menu.classList.remove('show');};menuList.appendChild(it);});
function toggleMenu(){menu.classList.toggle('show');grid.classList.remove('show');}
document.getElementById('menuBtn').onclick=toggleMenu;
document.getElementById('menuClose').onclick=()=>menu.classList.remove('show');
menu.onclick=e=>{if(e.target===menu)menu.classList.remove('show');};

addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev();}else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key.toLowerCase()==='f')toggleFs();else if(e.key.toLowerCase()==='g')toggleGrid();else if(e.key.toLowerCase()==='m')toggleMenu();else if(e.key==='Escape'){grid.classList.remove('show');menu.classList.remove('show');}});
let tx=0;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)dx<0?next():prev();});
function toggleFs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
document.getElementById('fsBtn').onclick=toggleFs;
const grid=document.getElementById('grid');
S.forEach((s,k)=>{if(s.section){const h=document.createElement('div');h.className='ghead';h.textContent=s.num+' · '+s.title;grid.appendChild(h);return;}if(!s.img)return;const fig=document.createElement('figure');fig.innerHTML=`<img src="images/${s.img}"><figcaption>${s.title}</figcaption>`;fig.onclick=()=>{go(k);grid.classList.remove('show');};grid.appendChild(fig);});
function toggleGrid(){grid.classList.toggle('show');menu.classList.remove('show');}
document.getElementById('gridBtn').onclick=toggleGrid;
document.getElementById('gclose').onclick=()=>grid.classList.remove('show');
render();
</script>
</body>
</html>
