<!DOCTYPE html>
<html lang="en">
<head>

<title>Zavmo — The Learner Journey</title>
<style>
  :root{--teal:#22c7a9;--teal-soft:#9fe8da;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#0a1b2e 0%,#102a49 55%,#0a1b2e 100%);color:#fff;overflow:hidden;height:100vh}
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9;transition:opacity .5s}
  .stars.dim{opacity:.32}
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}
  .bar{display:flex;align-items:center;gap:12px;padding:18px 26px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
  .zmark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,#16324f,#0a1b2e);display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .zmark span{font-weight:700;font-size:15px}
  .bar .spacer{flex:1}
  .counter{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);letter-spacing:.04em;margin-right:4px}
  .btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#dfe9f4;font-size:12px;letter-spacing:.04em;padding:7px 12px;border-radius:8px;cursor:pointer;transition:.15s}
  .btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28)}
  .btn.accent{border-color:rgba(34,199,169,.5);color:#bff0e5}
  .slide{flex:1;display:flex;align-items:center;justify-content:center;gap:46px;padding:6px 56px 26px;min-height:0}
  .copy{width:340px;flex:none}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:14px}
  .title{font-size:32px;line-height:1.13;font-weight:600;letter-spacing:-.01em;margin-bottom:16px}
  .caption{font-size:15.5px;line-height:1.62;color:#cdd9e7;font-weight:300}
  .step-no{margin-top:22px;font-size:13px;color:var(--muted)}
  .shotwrap{flex:1;height:100%;display:flex;align-items:center;justify-content:center;min-width:0}
  .shot{max-width:100%;max-height:100%;border-radius:13px;box-shadow:0 30px 70px -22px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);background:#fff;overflow:hidden;display:flex;flex-direction:column}
  .shot img{display:block;max-width:100%;max-height:74vh;border-radius:0}
  .shot.dark{background:#0a1422}
  .browser-bar{display:flex;align-items:center;gap:7px;padding:9px 14px;background:#eef2f7;flex:none}
  .shot.dark .browser-bar{background:#0f1d2e;border-bottom:1px solid rgba(255,255,255,.06)}
  .browser-bar .d{width:11px;height:11px;border-radius:50%}
  .d.r{background:#ff5f57}.d.y{background:#febc2e}.d.g{background:#28c840}
  .browser-url{flex:1;background:#fff;border-radius:6px;padding:4px 12px;font-size:12px;color:#5b6b7c;text-align:center;max-width:300px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:6px}
  .browser-url svg{width:11px;height:11px;opacity:.6}
  .shot.dark .browser-url{background:rgba(255,255,255,.06);color:#9fb3c8}
  .cover,.sectiondiv{flex-direction:column;gap:0;text-align:center}
  .cover .zbig{width:74px;height:74px;border-radius:20px;margin-bottom:30px}
  .cover .zbig span{font-size:36px}
  .cover .big{font-size:60px;line-height:1.05;font-weight:600;letter-spacing:-.02em}
  .cover .big em{font-style:normal;color:var(--teal)}
  .cover .sub{margin-top:22px;font-size:19px;color:#cdd9e7;font-weight:300;max-width:52ch;line-height:1.6}
  .cover .meta{margin-top:36px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .hint{margin-top:30px;font-size:13px;color:var(--muted)}
  .hint kbd{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:0 2px;font-size:12px}
  .sectiondiv .snum{font-size:15px;letter-spacing:.3em;color:var(--teal);font-weight:600;margin-bottom:18px}
  .sectiondiv .stitle{font-size:50px;font-weight:600;letter-spacing:-.02em;max-width:18ch}
  .sectiondiv .ssub{margin-top:18px;font-size:18px;color:#cdd9e7;font-weight:300;max-width:48ch;line-height:1.6}
  .sectiondiv .srule{width:54px;height:3px;background:linear-gradient(90deg,var(--teal),var(--teal-soft));border-radius:2px;margin:28px auto 0}
  .statementdiv{flex-direction:column;gap:0;text-align:center;padding:0 7vw}
  .statementdiv .seyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:22px}
  .statementdiv .sbig{font-size:52px;line-height:1.09;font-weight:600;letter-spacing:-.02em;max-width:22ch}
  .statementdiv .sbig em{font-style:normal;color:var(--teal)}
  .statementdiv .sbody{margin-top:26px;font-size:19.5px;line-height:1.62;color:#d4e0ec;font-weight:300;max-width:62ch}
  .statementdiv .sbody b{color:#fff;font-weight:500}
  .statementdiv .scredit{margin-top:26px;font-size:13px;letter-spacing:.04em;color:var(--muted)}
  .progress{height:3px;background:rgba(255,255,255,.08)}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-soft));transition:width .35s cubic-bezier(.4,0,.2,1)}
  .dots{display:flex;gap:5px;justify-content:center;padding:12px 0 16px;flex-wrap:wrap}
  .dots b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:.2s}
  .dots b.on{background:var(--teal);transform:scale(1.35)}
  .dots b.sec{width:5px;height:5px;background:rgba(34,199,169,.45);border-radius:1px;transform:rotate(45deg)}
  .dots b.sec.on{background:var(--teal)}
  .zone{position:fixed;top:64px;bottom:56px;width:20%;z-index:5;cursor:pointer}
  .zone.l{left:0}.zone.r{right:0}
  .nav-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:6;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;opacity:0;transition:.2s}
  .stage:hover .nav-arrow{opacity:.6}
  .nav-arrow:hover{opacity:1!important;background:rgba(255,255,255,.16)}
  .nav-arrow.l{left:18px}.nav-arrow.r{right:18px}
  .nav-arrow svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* jump-to-section menu */
  .menu{position:fixed;inset:0;background:rgba(8,17,29,.92);z-index:40;display:none;align-items:center;justify-content:center}
  .menu.show{display:flex}
  .menu-inner{width:min(680px,90vw);max-height:84vh;overflow:auto}
  .menu-title{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);font-weight:600;text-align:center;margin-bottom:24px}
  .menu-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .menu-item{display:flex;align-items:baseline;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);cursor:pointer;transition:.15s}
  .menu-item:hover{border-color:var(--teal);background:rgba(34,199,169,.08);transform:translateY(-2px)}
  .menu-item .mnum{font-size:12px;letter-spacing:.16em;color:var(--teal);font-weight:600;white-space:nowrap}
  .menu-item .mtit{font-size:18px;font-weight:600}
  .menu-item .msub{font-size:13px;color:var(--muted);font-weight:300;margin-top:2px}
  .menu-close{position:fixed;top:22px;right:28px;color:var(--muted);font-size:13px;letter-spacing:.1em;cursor:pointer}
  .grid{position:fixed;inset:0;background:rgba(8,17,29,.97);z-index:30;display:none;grid-template-columns:repeat(4,1fr);gap:15px;padding:54px;overflow:auto;align-content:start}
  .grid.show{display:grid}
  .grid .ghead{grid-column:1/-1;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-top:8px}
  .grid figure{cursor:pointer;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0f2540;transition:.18s}
  .grid figure:hover{border-color:var(--teal);transform:translateY(-3px)}
  .grid img{width:100%;display:block}
  .grid figcaption{font-size:12px;color:#cdd9e7;padding:8px 10px}
  .grid .gclose{position:fixed;top:20px;right:26px;color:var(--muted);font-size:13px;letter-spacing:.1em;cursor:pointer}
  @media (max-width:1024px){.slide{flex-direction:column;gap:18px;padding:10px 22px 18px}.copy{width:100%;max-width:680px;text-align:center}.shot img{max-height:50vh}.menu-list{grid-template-columns:1fr}}
  .fade{animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

  { statement:true, chart:'twosigma', eyebrow:'The proof', title:'Two standard deviations',

  { img:'03.png', eyebrow:'Onboarding · Chapter 1', title:'Who you are', caption:'Zavmo introduces itself and learns the basics — one gentle question at a time, with a progress rail on the right.' },

  { section:true, num:'PART 3', title:'Your dashboard', sub:'Everything personal, in one place.' },
  { img:'12.png', eyebrow:'In the app · Home', title:'Zavmo notices, in your words', caption:'The home isn’t a list of courses — it’s Zavmo talking to you. “I’ve been noticing…” narrates exactly where you stand (“profile complete, JD mapped, TNA done — the groundwork is all there”) and the one thing that would move you forward. You can push back live — “Reflect again” or “I’ve got it wrong” — and it re-reads you. A dashboard that actually knows you.' },
  { img:'36.png', eyebrow:'In the app · Continuity', title:'It picks up exactly where you left off', caption:'“Pick up where you left off” drops you back into the conversation mid-sentence — no re-finding your place. Your active path shows the nationally-recognised qualification, the units inside it, and an honest “on track, finish by late November.” Every interaction is logged as an xAPI statement (17 already) — and cohort signals only appear once enough peers join, fully anonymised. Personal, accountable, private.' },

  { section:true, num:'PART 4', title:'Discover & assess', sub:'Choose a real qualification, then prove where you actually stand.' },
  { img:'27.png', eyebrow:'Discover · Your job description', title:'See your whole role, in full', caption:'Here’s the learner’s own role — API Product Manager — as a complete job description: the real day-to-day, every responsibility broken down by experience band (Mid vs. Experienced), and exactly who they work with. The learner sees precisely what their role demands — and what the learning is building them toward. No guesswork.' },

  { img:'35.png', eyebrow:'Discover · Inside the qualification', title:'See exactly what you’ll learn', caption:'Open any unit and the full standard is laid bare — the National Occupational Standard it maps to, its level, every Performance Criterion (what you must be able to do) and every Knowledge Requirement (what you must understand). The real substance of the learning, in the open — a huge benefit for a learner deciding what to commit to.' },

  { img:'18.png', eyebrow:'Assessment · Pedagogy', title:'Built on Bloom’s taxonomy', caption:'The backbone of how Zavmo teaches. Every skill is mapped across the six cognitive levels — Remember, Understand, Apply, Analyse, Evaluate, Create — so progress is measured by depth of understanding, not boxes ticked. This is mastery learning: the one-to-one, two-sigma method, delivered at scale.' },

  { img:'38.png', eyebrow:'Deliver · In the flow', title:'It checks you, mid-conversation', caption:'No separate quiz tab. Right inside the lesson, Zavmo poses a real multiple-choice dilemma — “you’ve got 90 seconds in standup, what do you say?” — with options that are genuinely tempting but wrong. The Bloom-level chip (Analyse) and the assessment criteria on the right update live as you answer. This is a real moment, captured from an actual lesson.' },
  { img:'33.png', eyebrow:'Deliver · Interactive & gamified', title:'You steer it — and it scores you', caption:'Every message is interactive: answer in your own words, or tap “Got it”, “Slower please”, “Show me an example” or “Read it to me”. And it’s gamified — Zavmo grades your thinking live at Bloom level 4 (Analysing) and tracks you against the learning outcomes as you go.' },
  { img:'37.png', eyebrow:'Deliver · Interactive cards', title:'It drops you into a live scenario', caption:'Mid-lesson, Zavmo turns teaching into doing: it hands you a real scenario — your team has 48 hours to fix a critical API — and an interactive card asking what you’d say first to keep them owning the problem. You don’t read about leadership; you practise it, in the moment, and Zavmo responds to your actual answer.' },

  { statement:true, eyebrow:'Deliver · Five ways to make it stick', big:'It doesn’t test you. It plays with you.', body:'Beyond the conversation, Zavmo weaves in five kinds of interactive game — matching, sequencing, fill-the-gap, sorting and prioritising — each tagged to a Bloom’s level. Learning by doing, not by reading.' },

  { img:'28.png', eyebrow:'Deliver · Voice', title:'Talk to Zavmo, hands-free', caption:'Learners don’t have to type. Turn on voice and Zavmo reads every reply aloud and transcribes what you say (via ElevenLabs) — streamed in the moment, never stored, consent you can withdraw any time.' },
  { img:'23.png', eyebrow:'Deliver · Gamified progress', title:'Progress you can see', caption:'A live module-completion bar, the learning outcomes being met, and space for the learner’s own notes — momentum made visible.' },
  { img:'44.png', eyebrow:'Deliver · Mastery', title:'It knows when you’ve got it', caption:'When you’ve genuinely met every learning outcome — proven through the conversation, not a tick-box — Zavmo closes the lesson with “Brilliant work,” confirms the outcomes, and opens the door to the assessment. Captured live at the end of a real lesson.' },

function render(){
  const s=S[i];
  slide.className='slide fade'+(s.cover?' cover':'')+(s.section?' sectiondiv':'')+(s.statement?' statementdiv':'');
  if(s.cover){slide.innerHTML=`<span class="zmark zbig"><span>Z</span></span><div class="big">${s.big}</div><div class="sub">${s.sub}</div><div class="meta">Live product walk-through</div><div class="hint">Use <kbd>←</kbd> <kbd>→</kbd> or click · <kbd>P</kbd> autoplay · <kbd>M</kbd> sections · <kbd>G</kbd> overview · <kbd>F</kbd> fullscreen</div>`;}
  else if(s.section){slide.innerHTML=`<div class="snum">${s.num}</div><div class="stitle">${s.title}</div><div class="ssub">${s.sub}</div><div class="srule"></div>`;}
  else if(s.chart==='twosigma'){const yb=360,amp=240,sd=92,mu1=320,mu2=660,bell=(mu)=>{let p='';for(let x=70;x<=930;x+=10.75){const y=yb-amp*Math.exp(-((x-mu)*(x-mu))/(2*sd*sd));p+=(p?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';}return p;};slide.innerHTML=`<div style="text-align:center;width:100%;max-width:1000px"><div class="seyebrow">${s.eyebrow}</div><div class="sbig" style="font-size:38px;margin-bottom:4px">${s.title}</div><svg viewBox="0 0 1000 430" style="width:100%;max-width:900px;margin-top:6px"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#22c7a9"/></marker></defs><line x1="60" y1="${yb}" x2="940" y2="${yb}" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/><path d="${bell(mu2)}L930 ${yb} L70 ${yb} Z" fill="rgba(34,199,169,.13)"/><path d="${bell(mu1)}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.5"/><path d="${bell(mu2)}" fill="none" stroke="#22c7a9" stroke-width="3.5"/><circle cx="${mu1}" cy="${yb-amp}" r="5" fill="#fff"/><circle cx="${mu2}" cy="${yb-amp}" r="6.5" fill="#22c7a9"/><line x1="${mu1+10}" y1="${yb-amp-26}" x2="${mu2-14}" y2="${yb-amp-26}" stroke="#22c7a9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="${(mu1+mu2)/2}" y="${yb-amp-36}" text-anchor="middle" fill="#9fe8da" font-size="22" font-weight="600">+2σ</text><text x="${mu1}" y="${yb+32}" text-anchor="middle" fill="rgba(255,255,255,.62)" font-size="17">Average classroom</text><text x="${mu1}" y="${yb+54}" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="14">50th percentile</text><text x="${mu2}" y="${yb+32}" text-anchor="middle" fill="#9fe8da" font-size="17" font-weight="500">With a personal tutor</text><text x="${mu2}" y="${yb+54}" text-anchor="middle" fill="rgba(159,232,218,.7)" font-size="14">98th percentile</text></svg>${s.body?`<div class="sbody" style="margin:14px auto 0">${s.body}</div>`:''}</div>`;}
  else if(s.statement){slide.innerHTML=`${s.eyebrow?`<div class="seyebrow">${s.eyebrow}</div>`:''}<div class="sbig">${s.big}</div>${s.body?`<div class="sbody">${s.body}</div>`:''}${s.credit?`<div class="scredit">${s.credit}</div>`:''}`;}
  else{const ci=contentIndexOf(i);slide.innerHTML=`<div class="copy"><div class="eyebrow">${s.eyebrow}</div><div class="title">${s.title}</div><div class="caption">${s.caption}</div><div class="step-no">${ci} / ${contentCount}</div></div><div class="shotwrap"><div class="shot${s.darkframe?' dark':''}"><div class="browser-bar"><span class="d r"></span><span class="d y"></span><span class="d g"></span><span class="browser-url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>${BRAND_URL}</span></div><img src="images/${s.img}" alt="${s.title}"></div></div>`;}
  counter.textContent=(i+1)+' / '+S.length;
  bar.style.width=(i/(S.length-1)*100)+'%';
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
  try{document.getElementById('stars').classList.toggle('dim',!!s.img)}catch(e){}
  void slide.offsetWidth;
}
// Living constellation backdrop — echoes the Mind Palace.
(function(){const c=document.getElementById('stars');if(!c)return;const ctx=c.getContext('2d');let W,H,DPR,stars=[];
function init(){const n=Math.min(110,Math.round((innerWidth*innerHeight)/15000));stars=[];for(let k=0;k<n;k++)stars.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.5+0.5)*DPR,a:Math.random()*0.5+0.2,tw:Math.random()*6.28,sp:Math.random()*0.012+0.004,vx:(Math.random()-0.5)*0.05*DPR,vy:(Math.random()-0.5)*0.05*DPR});}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=c.width=innerWidth*DPR;H=c.height=innerHeight*DPR;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';init();}
const MAX=130*Math.min(2,window.devicePixelRatio||1);
function frame(){ctx.clearRect(0,0,W,H);for(const s of stars){s.x+=s.vx;s.y+=s.vy;if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;s.tw+=s.sp;}
ctx.lineWidth=DPR;for(let a=0;a<stars.length;a++){for(let b=a+1;b<stars.length;b++){const s1=stars[a],s2=stars[b],dx=s1.x-s2.x,dy=s1.y-s2.y,d2=dx*dx+dy*dy,mx=MAX*MAX;if(d2<mx){ctx.strokeStyle='rgba(34,199,169,'+((1-d2/mx)*0.09)+')';ctx.beginPath();ctx.moveTo(s1.x,s1.y);ctx.lineTo(s2.x,s2.y);ctx.stroke();}}}
for(const s of stars){const al=s.a*(0.55+0.45*Math.sin(s.tw));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fillStyle='rgba(159,232,218,'+al+')';ctx.fill();}
requestAnimationFrame(frame);}
addEventListener('resize',resize);resize();frame();})();
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
function next(){if(i<S.length-1)go(i+1);}function prev(){if(i>0)go(i-1);}
let autoTimer=null;function toggleAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;document.body.classList.remove('playing');}else{document.body.classList.add('playing');autoTimer=setInterval(()=>go(i<S.length-1?i+1:0),6500);}}
S.forEach((s,k)=>{const b=document.createElement('b');if(s.section||s.statement)b.className='sec';b.onclick=()=>go(k);dots.appendChild(b);});
document.getElementById('zr').onclick=next;document.getElementById('zl').onclick=prev;
document.getElementById('ar').onclick=next;document.getElementById('al').onclick=prev;

// jump-to-section menu
const menu=document.getElementById('menu'),menuList=document.getElementById('menuList');
S.forEach((s,k)=>{if(!s.section)return;const it=document.createElement('div');it.className='menu-item';it.innerHTML=`<span class="mnum">${s.num}</span><div><div class="mtit">${s.title}</div><div class="msub">${s.sub}</div></div>`;it.onclick=()=>{go(k);menu.classList.remove('show');};menuList.appendChild(it);});
function toggleMenu(){menu.classList.toggle('show');grid.classList.remove('show');}
document.getElementById('menuBtn').onclick=toggleMenu;
document.getElementById('menuClose').onclick=()=>menu.classList.remove('show');
menu.onclick=e=>{if(e.target===menu)menu.classList.remove('show');};

addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev();}else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key.toLowerCase()==='f')toggleFs();else if(e.key.toLowerCase()==='g')toggleGrid();else if(e.key.toLowerCase()==='m')toggleMenu();else if(e.key.toLowerCase()==='p')toggleAuto();else if(e.key==='Escape'){grid.classList.remove('show');menu.classList.remove('show');if(autoTimer)toggleAuto();}});
let tx=0;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)dx<0?next():prev();});
function toggleFs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
document.getElementById('fsBtn').onclick=toggleFs;
const grid=document.getElementById('grid');
S.forEach((s,k)=>{if(s.section){const h=document.createElement('div');h.className='ghead';h.textContent=s.num+' · '+s.title;grid.appendChild(h);return;}if(!s.img)return;const fig=document.createElement('figure');fig.innerHTML=`<img src="images/${s.img}"><figcaption>${s.title}</figcaption>`;fig.onclick=()=>{go(k);grid.classList.remove('show');};grid.appendChild(fig);});
function toggleGrid(){grid.classList.toggle('show');menu.classList.remove('show');}
document.getElementById('gridBtn').onclick=toggleGrid;
document.getElementById('gclose').onclick=()=>grid.classList.remove('show');
render();
</script>
</body>
</html>
